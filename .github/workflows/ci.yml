name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uvx ruff@0.17.1 check .
      - run: uvx ruff@0.17.1 format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bwrap needs them
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # real codex for tests/test_codex_contract.py (offline, no login); bump to check a new codex release
      - run: |
          npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund @openai/codex@0.163.0
          echo "$RUNNER_TEMP/codex/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: codex --version
      - run: uv run pytest -q
