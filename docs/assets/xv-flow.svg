<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" xml:space="preserve" role="img" aria-label="xv flow on Linux: Claude Code writes a brief and runs xv start codex; xv runs codex or agy inside bubblewrap (bwrap) with the filesystem read-only by default, codex also under its own sandbox (-s read-only, or workspace-write with --write), and --write DIR adds one worktree as writable; a tmux pane shows each action live; the answer lands in a job directory and Claude reads response.md">
  <!-- generated by a one-off script; 14-second loop: brief 0-1.4 s, xv 1.4-3, read-only vendors 3-4, pane 4-9, response 9-10.4, Claude reads it 10.4-13.5 -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .dim { fill: #8b949e; font-size: 12px; }
    .txt { fill: #c9d1d9; font-size: 13px; }
    .head { fill: #e6edf3; font-size: 14px; font-weight: 700; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .arrow { stroke: #8b949e; stroke-width: 2; fill: none; }
    .codex { fill: #3fb950; }
    .agy { fill: #58a6ff; }
    .lock { fill: #f0e442; font-size: 12px; }
    .ok { fill: #3fb950; }
    .a1 { animation-name: a1; } @keyframes a1 { 0%,2.86% { opacity: 0 } 5.00%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .ar1 { animation-name: ar1; } @keyframes ar1 { 0%,10.00% { opacity: 0 } 12.14%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .x1 { animation-name: x1; } @keyframes x1 { 0%,12.86% { opacity: 0 } 15.00%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .freq { animation-name: freq; } @keyframes freq { 0%,16.43% { opacity: 0 } 18.57%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .ar2 { animation-name: ar2; } @keyframes ar2 { 0%,21.43% { opacity: 0 } 23.57%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .ro { animation-name: ro; } @keyframes ro { 0%,25.00% { opacity: 0 } 27.14%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .p0 { animation-name: p0; } @keyframes p0 { 0%,28.57% { opacity: 0 } 30.71%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .ar4 { animation-name: ar4; } @keyframes ar4 { 0%,28.57% { opacity: 0 } 30.71%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .p1 { animation-name: p1; } @keyframes p1 { 0%,32.86% { opacity: 0 } 35.00%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .fev { animation-name: fev; } @keyframes fev { 0%,34.29% { opacity: 0 } 36.43%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .p2 { animation-name: p2; } @keyframes p2 { 0%,40.00% { opacity: 0 } 42.14%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .p3 { animation-name: p3; } @keyframes p3 { 0%,47.14% { opacity: 0 } 49.29%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .p4 { animation-name: p4; } @keyframes p4 { 0%,57.14% { opacity: 0 } 59.29%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .fresp { animation-name: fresp; } @keyframes fresp { 0%,64.29% { opacity: 0 } 66.43%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .st { animation-name: st; } @keyframes st { 0%,64.29% { opacity: 0 } 66.43%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .ar3 { animation-name: ar3; } @keyframes ar3 { 0%,74.29% { opacity: 0 } 76.43%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .c2 { animation-name: c2; } @keyframes c2 { 0%,80.00% { opacity: 0 } 82.14%,96.43% { opacity: 1 } 98.21%,100% { opacity: 0 } }
    .glow { animation-name: glow; } @keyframes glow { 0%,12.86% { stroke: #30363d } 14.29%,64.29% { stroke: #e6edf3 } 66.43%,100% { stroke: #30363d } }
    @media (prefers-reduced-motion: reduce) { .t { animation: none; opacity: 1; } .glow { stroke: #30363d; } }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="372" rx="12" fill="#0d1117"/>

  <!-- Claude Code -->
  <rect class="box" x="20" y="40" width="160" height="110" rx="8"/>
  <text class="head" x="34" y="66">Claude Code</text>
  <text class="txt t a1" x="34" y="94">writes brief.md</text>
  <text class="txt t a1" x="34" y="114">xv start codex</text>
  <text class="txt t a1" x="34" y="132">  --file brief.md</text>
  <path class="arrow t ar1" d="M180 95 H212" marker-end="url(#h)"/>

  <!-- xv -->
  <rect class="box t glow" x="216" y="40" width="140" height="110" rx="8"/>
  <text class="head" x="230" y="66">xv</text>
  <text class="txt t x1" x="230" y="94">new job 3949</text>
  <text class="dim t x1" x="230" y="114">read-only unless</text>
  <text class="dim t x1" x="230" y="132">--write worktree</text>
  <path class="arrow t ar2" d="M356 80 H372 V67 H392" marker-end="url(#h)"/>
  <path class="arrow t ar2" d="M356 110 H372 V127 H392" marker-end="url(#h)"/>

  <!-- vendors -->
  <rect class="box" x="396" y="40" width="216" height="54" rx="8"/>
  <text class="head codex" x="410" y="62">codex exec</text>
  <text class="lock t ro" x="410" y="82">bwrap + -s read-only</text>
  <rect class="box" x="396" y="100" width="216" height="54" rx="8"/>
  <text class="head agy" x="410" y="122">agy -p</text>
  <text class="lock t ro" x="410" y="142">bwrap: / read-only</text>
  <path class="arrow t ar2" d="M612 67 H628 V95 H648" marker-end="url(#h)"/>
  <path class="arrow t ar2" d="M612 127 H628 V95"/>

  <!-- job directory -->
  <rect class="box" x="652" y="40" width="228" height="134" rx="8"/>
  <text class="head" x="666" y="66">job directory</text>
  <text class="dim" x="666" y="86">~/.local/share/xvendor/jobs/</text>
  <text class="txt t freq" x="666" y="112">round-1/request.md</text>
  <text class="txt t fev" x="666" y="134">round-1/events.jsonl</text>
  <text class="txt t fresp ok" x="666" y="156">round-1/response.md</text>

  <!-- tmux pane -->
  <path class="arrow t ar4" d="M504 154 V196" marker-end="url(#h)"/>
  <text class="dim t ar4" x="512" y="182">events, live</text>
  <rect class="box t glow" x="396" y="200" width="484" height="156" rx="8"/>
  <text class="dim" x="410" y="220">tmux pane beside Claude</text>
  <text class="txt t p0" x="410" y="244"><tspan class="codex">codex</tspan> | 3949 | round 1 | limit 20 min</text>
  <text class="txt t p1" x="410" y="264">  run    rg -n "def resolve" src</text>
  <text class="txt t p2" x="410" y="284">  run    sed -n '80,100p' src/jobs.py</text>
  <text class="txt t p3" x="410" y="304">  note   suffix is accepted only when unique</text>
  <text class="txt t p4" x="410" y="324">[ response ]  2 findings, src/jobs.py:88</text>
  <text class="txt t st" x="410" y="344"><tspan class="ok">done</tspan> | 92s | full text: xv show 3949</text>

  <!-- back to Claude -->
  <path class="arrow t ar3" d="M766 40 V26 H100 V38" marker-end="url(#h)"/>
  <text class="dim t ar3" x="330" y="19">Claude reads response.md</text>
  <rect class="box t c2" x="20" y="170" width="356" height="70" rx="8"/>
  <text class="txt t c2" x="34" y="198">opens src/jobs.py:88 to check</text>
  <text class="txt t c2" x="34" y="220">each finding before using it</text>
</svg>
