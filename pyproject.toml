[project]
name = "xvendor"
version = "0.1.0"
description = "Cross-vendor headless CLI job runner (xv)"
authors = [
    { name = "Mango", email = "mango79314@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["rich"]

[project.scripts]
xv = "xvendor.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
