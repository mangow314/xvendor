[project]
name = "xvendor"
version = "0.1.0"
description = "Send read-only review and research jobs from Claude Code to codex and agy, with a live tmux pane and a job directory per run"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mango", email = "mango79314@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["rich"]

[project.urls]
Homepage = "https://github.com/mangow314/xvendor"
Repository = "https://github.com/mangow314/xvendor"
Issues = "https://github.com/mangow314/xvendor/issues"

[project.scripts]
xv = "xvendor.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
